[package]
name = "bungalow-client"
description = "The Bungalow desktop client: an egui/eframe window hosting the Space UI, with CEF for web sites and HTML5 apps"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "bungalow-client"
path = "src/main.rs"

[features]
default = ["swimming"]
# Runs "AppType": "Swimming" bundles: React (TSX) apps rendered natively by
# the swimming framework, with no browser engine.
swimming = ["dep:swimming", "dep:swimming-core"]
# Embeds web sites and HTML5 app bundles with CEF (offscreen rendering).
# The cef crate downloads CEF and needs CMake and Ninja; see the README.
cef = ["dep:cef"]
# Plays local files with rodio (needs ALSA headers on Linux).
audio = ["bungalow/audio"]

[dependencies]
space = { path = "../space" }
bungalow = { path = "../bungalow" }
serde_json.workspace = true
egui.workspace = true
eframe.workspace = true
log.workspace = true
env_logger.workspace = true
ureq.workspace = true
rfd = "0.15"
cef = { version = "156.2", optional = true, default-features = false }
swimming = { workspace = true, optional = true }
swimming-core = { workspace = true, optional = true }
